# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    ignore:
      # dotenv 18 ships its own `dotenv` bin, which replaces dotenv-cli's and breaks
      # every `dotenv -e .env.local --` script. Its CLI also skips the `\$`
      # unescaping that .env.local relies on.
      - dependency-name: "dotenv"
        update-types: ["version-update:semver-major"]

  # Keeps the `uses:` tags in .github/workflows current. Without this, pinned
  # actions silently fall behind and the runner warns about their declared
  # Node runtime (node20 actions forced onto node24).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

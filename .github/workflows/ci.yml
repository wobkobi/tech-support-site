name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main, dev]
  # Only main, so a branch with an open pull request is not checked twice: the
  # pull_request event already covers every push to that branch.
  push:
    branches: [main]

# Supersede a run when its ref is pushed again. Grouping by ref keeps branches
# from cancelling each other, and a cancelled run reports "cancelled" rather
# than "success", so the auto-merge workflow ignores it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # The build prerenders pages that read settings from MongoDB, so it runs
    # against an empty database on the runner rather than the real one:
    # Dependabot runs get no secrets, and no pull request's code sees the
    # production connection string. Every setting falls back to its default.
    # The container goes away with the job.
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017

    env:
      MONGODB_URI: mongodb://localhost:27017/ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      # Dependabot pull requests are built too, against the same empty
      # database, and auto-merge queues patch and minor bumps, so this is the
      # signal that a bump still compiles.
      - name: Build application
        run: npm run build

  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript type check
        run: npm run typecheck
